
<!DOCTYPE html>
<html>

<head>
    <title>Test</title>

    <script>
        function stampa() {
            var nome = document.getElementById("teston").value;
            var cognome = document.getElementById("testoc").value;

            document.getElementById("risultato").innerHTML = nome + " " + cognome;
        }
    </script>
</head>

<body>

    <table>
        <tr>
            <th>Nome</th>
            <th>Cognome</th>
        </tr>

        <tr>
            <td><input type="text" id="teston"></td>
            <td><input type="text" id="testoc"></td>
        </tr>
    </table>

    <br>

    <input type="button" value="Stampa" onclick="stampa()">

    <p id="risultato"></p>

</body>

</html>
