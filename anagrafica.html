
<!DOCTYPE html>
<html>
<head>
    <title>Scheda TEST1</title>
</head>
<body>

    <h1>Inserisci Dati</h1>

    Nome: <input type="text" id="nome"><br><br>
    Cognome: <input type="text" id="cognome"><br><br>
    Età: <input type="number" id="eta"><br><br>
    Indirizzo: <input type="text" id="indirizzo"><br><br>

    Sesso:
    <input type="radio" name="sesso" value="M" checked> M
    <input type="radio" name="sesso" value="F"> F
    <input type="radio" name="sesso" value="Altro"> Altro

    <br><br>

    <button onclick="aggiungiDati()">Aggiungi</button>

    <h2>Tabella Anagrafica</h2>

    <table border="1" id="tabella">
        <tr>
            <th>Nome</th>
            <th>Cognome</th>
            <th>Età</th>
            <th>Indirizzo</th>
            <th>Sesso</th>
        </tr>
    </table>

    <script>
        function aggiungiDati() {

            let nome = document.getElementById("nome").value;
            let cognome = document.getElementById("cognome").value;
            let eta = document.getElementById("eta").value;
            let indirizzo = document.getElementById("indirizzo").value;
            let sesso = document.querySelector('input[name="sesso"]:checked').value;

            let tabella = document.getElementById("tabella");

            let riga = tabella.insertRow();

            riga.insertCell().textContent = nome;
            riga.insertCell().textContent = cognome;
            riga.insertCell().textContent = eta;
            riga.insertCell().textContent = indirizzo;
            riga.insertCell().textContent = sesso;

        }
    </script>

</body>
</html>
